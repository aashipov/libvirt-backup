name: Native Shell Script Check

on: [push, pull_request]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run ShellCheck natively
        run: |
          # Find all .sh files and run shellcheck on them
          find . -name "*.sh" -exec shellcheck {} +
